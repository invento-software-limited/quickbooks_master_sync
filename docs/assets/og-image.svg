<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="180" fill="#ffffff" opacity="0.04"/>
  <circle cx="1100" cy="500" r="260" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="550" r="140" fill="#ffffff" opacity="0.05"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- Shield icon -->
  <rect x="70" y="120" width="64" height="80" rx="12" fill="#3b82f6" opacity="0.9"/>
  <rect x="82" y="140" width="40" height="48" rx="8" fill="#ffffff" opacity="0.9"/>
  <path d="M92 168 l8 8 16-16" stroke="#1e40af" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Content -->
  <text x="160" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">QuickBooks Master Sync</text>
  <text x="160" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="0.01em">QuickBooks Online → ERPNext Master Data Sync</text>
  <!-- Badge -->
  <rect x="160" y="310" width="200" height="40" rx="20" fill="#3b82f6" opacity="0.9"/>
  <text x="260" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Documentation</text>
  <!-- Feature pills -->
  <rect x="160" y="380" width="250" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
  <text x="285" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">Chart of Accounts</text>
  <rect x="430" y="380" width="220" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
  <text x="540" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">Customers &amp; Suppliers</text>
  <rect x="670" y="380" width="200" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
  <text x="770" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">Items &amp; Tax Rates</text>
  <!-- Footer -->
  <text x="70" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.5)">Invento Software Limited</text>
</svg>
